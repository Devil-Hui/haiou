# ============================================================================
# Nginx 主配置（容器内 /etc/nginx/nginx.conf）
#
# 容器版不需要在宿主机装系统 Nginx，配置完全由我们掌控，worker 层直接写在
# main 上下文；Docker 是唯一部署方式，因此没有裸机版 nginx.conf 的兼容负担。
#
# 调优基线：2 核 2 GB 单机，目标并发 100。
#   worker_processes  = auto（读 CPU 亲和性掩码，等于核数）
#   worker_connections = worker_processes × 1024 = 2048
#
# 关于 2048 这个数：它不是"同时处理 2048 个请求"，而是"能挂住 2048 条连接"。
# 真正的并行处理能力由 CPU 核数决定。keepalive 长连接会长期占用槽位，所以
# 需要余量——但也不需要更多：2 核机器上开 8192 只是让内核多维护一堆空epoll 项，
# 既不提升吞吐，还让内存白白多占几 MB。官方建议值是 ×1000，这里取 ×1024 是为了
# 在 2 核下正好等于 2048，与裸机方案保持一致，便于对照排查。
# ============================================================================

# ---- worker 层 ---------------------------------------------------------------
# ⚠️ 上下文归属（写错会被 nginx -t 直接拒绝，是最容易踩的一类错）：
#   main上下文：worker_processes / worker_rlimit_nofile / worker_shutdown_timeout
#   events 上下文：worker_connections / multi_accept / use epoll
#   混写会报 "directive is not allowed here"。
#
# ⚠️ 这里必须是**纯 ${VAR}**，不能写 ${VAR:-默认值}：
# envsubst 不支持 shell 的 :- 语法，写了它会原样保留整串，
# Nginx 会报 "directive invalid value"。
# 未注入时的兜底值由 entrypoint.sh 用 shell 设置（那里才支持 :- 语法）。
#
# 三个值由部署时在 .env / compose 里注入（如 NGINX_WORKER_PROCESSES），
# 升配（2C2G → 4C8G）后在 .env 里改并重建 nginx 容器即可，无需改本文件。

# auto 会读 CPU 亲和性掩码，在容器里同样准确；比写死 2 更适应升配。
# 未注入时 entrypoint 给 auto（读核数），注入时用显式值。
worker_processes  ${NGINX_WORKER_PROCESSES};

# 单进程可打开的文件句柄上限。必须 ≤ 容器 ulimit -n（compose 里由同一公式给出），
# 否则 "too many open files" 会直接打挂 worker。
worker_rlimit_nofile  ${NGINX_WORKER_RLIMIT_NOFILE};

# worker 优雅退出的等待上限。
# reload 时 Nginx 给老 worker 5s 处理完手上的连接再退出。
# 设 0 = 立即关闭所有连接（更快 reload，但会掐断进行中的请求）；
# 设 5s = 让在途请求收尾，代价是 reload 期间会短暂多占一份 worker 内存。
# 2C2G 上 5s 是折中：多占的内存可控，换来 reload 不断连接。
worker_shutdown_timeout 5s;

# ---- 动态模块 ---------------------------------------------------------------
# brotli 必须显式 load_module：Alpine 把它做成动态模块，不加载这行
# nginx -t 会直接报 unknown directive "brotli"（而不是启动失败，
# 所以**语法校验是唯一能提前发现这个问题的环节**）。
#
# ⚠️ 上下文：load_module 属于 **main** 上下文，必须在 http{} 之前。
# 放进 http{} 里会报 "load_module directive is not allowed here"。
load_module modules/ngx_http_brotli_filter_module.so;
load_module modules/ngx_http_brotli_static_module.so;

events {
    # 单 worker 能挂多少连接。官方建议 = worker_processes × 1000。
    #
    # 关于这个数：它不是"同时处理 N 个请求"，而是"能挂住 N 条连接"。
    # 真正的并行处理能力由 CPU 核数决定。keepalive 长连接会长期占用槽位，
    # 所以需要余量；但也不需要更多——2 核机器上开 8192 只是让内核多维护一堆
    # 空epoll 项，既不提升吞吐，还让内存白白多占几 MB。
    worker_connections  ${NGINX_WORKER_CONNECTIONS};

    # 一次 accept 多个新连接：短连接为主的前端场景能省 syscall。
    multi_accept on;

    # Linux 高性能事件模型。配合 epoll，2 核能吃满连接数。
    use epoll;
}

# ---- 全局 --------------------------------------------------------------------

# 日志：容器里走 stdout/stderr，由 docker json-file 驱动轮转。
# 单独再落一份文件是因为 Nginx 需要 error_log 的精细级别控制，
# 而 Docker 的日志驱动不区分级别。
# access_log 在 http 块用log_format 覆盖（见下），这里只兜底。
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

# ---- http --------------------------------------------------------------------

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ---- 日志格式 ----------------------------------------------------------
    # 三段式设计，兼顾可读性与排障能力：
    #   $realip_remote_addr —— 真实的客户端 IP（经 realip 模块还原，见conf.d/00-cloudflare-realip.conf）
    #   $remote_addr       —— 实际建立 TCP 连接的对端（直连时=客户端；经 CF 时=CF 节点）
    #   $http_cf_ray       —— Cloudflare 请求 ID，出问题时把CF-RAY 给 Cloudflare 工单能直达具体请求
    #
    # 单独记$remote_addr 而不是只记真实 IP 的原因：加了 Cloudflare 后，
    # 真实 IP 来自 CF-Connecting-IP 头。一旦真实 IP 还原逻辑出 bug，
    # 只有同时保留 $remote_addr 才能在日志里看出"这个 IP 是不是 CF 节点"，
    # 从而立刻分辨是信任链问题还是攻击问题。
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time urt=$upstream_response_time '
                      'cs=$upstream_cache_status cip=$http_cf_connecting_ip ray=$http_cf_ray';

    access_log  /var/log/nginx/access.log  main;

    # ---- 传输层性能 --------------------------------------------------------
    sendfile      on;    # 静态文件零拷贝：sendfile() 代替 read()+write()，
                         # 省掉一次用户态到内核态的拷贝与内存分配
    tcp_nopush    on;    # 与 sendfile 配套：攒够 MSS 再发，减少小包
    tcp_nodelay   on;    # 生效于 keepalive 连接：第一个字节立刻发出，
                         # 否则响应会被 Nagle 算法拖 40ms（这对 API 延迟影响很大）

    keepalive_timeout   30s;   # 空闲连接保持时长。30s 是 HTTP 官方建议值；
                               # 设太长会让 2 核机器上堆积大量空闲 fd
    keepalive_requests  1000;  # 单连接处理 1000 请求后主动关闭，避免长连接内存无限累积
    reset_timedout_connection on;  # 客户端超时断开时立即释放关联连接

    server_tokens  off;   # 不回显版本号，减少指纹识别面

    # ---- 请求体上限 --------------------------------------------------------
    # 全局给足 256k：本项目无文件上传（接口自身限制 4~16KB），
    # 收紧到能明显挡掉恶意大 body 即可，不必到 1m。
    client_max_body_size    256k;
    client_body_timeout     15s;   # 收body 超时。太小会打断慢速上传，太大会被慢连接占住 worker
    client_header_timeout   15s;   # 收请求头超时

    # ---- 头部缓冲 ----------------------------------------------------------
    # 2C2G 上不必放大。默认 1k/8k 足够本站（Cookie + Authorization 不长）。
    # 头部缓冲是**按需分配**的，放大只会让恶意大头部更容易占内存。
    client_header_buffer_size    1k;
    large_client_header_buffers  4 8k;

    # ---- WebSocket / 长连接 ------------------------------------------------
    # HTTP/1.1 升级请求必须由独立的 map 决定 Connection 头的取值。
    #
    # 为什么不能无条件写Connection ""（upstream keepalive 的常规做法）：
    # 那样 WebSocket 握手的 Upgrade 头会被吃掉，连接建立后无法升级，
    # 表现为前端连不上实时通道。map 的作用是「升级则透传，其余清空」，
    # 两种连接形态互不干扰。
    map $http_upgrade $connection_upgrade {
        default  upgrade;   #带Upgrade 头 → 透传，允许升级
        ''       close;     # 普通请求 → 关掉，upstream keepalive 才能生效
    }

    # ---- 限流与连接数 ------------------------------------------------------
    # zone 大小按 2C2G 取 10m（约 16 万个 IP 槽位，远超目标并发 100）。
    # 不需要设更大：zone 是常驻内存，1m 换 1.6 万槽位对本站毫无意义。
    limit_req_zone  $binary_remote_addr zone=haiou_req:10m  rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=haiou_conn:10m;

    # 限流命中时返回 **429** 而不是 Nginx 默认的 503。
    #
    # 为什么要改：503 语义是"服务暂时不可用"，会导致
    #   - 监控/告警把限流误判为后端故障，值班被无意义叫醒
    #   - Cloudflare 可能把 5xx 当源站错误
    #   - 客户端重试逻辑通常对 5xx 立即重试，反而加剧压力
    # 429 明确表达"请求过多，请稍后重试"，是最贴切的语义。
    limit_req_status   429;
    limit_conn_status 429;

    # ---- 代理缓存路径 ------------------------------------------------------
    # 静态资源缓存由 conf.d 内的 location 定义各自的 keys_zone，
    # 这里只声明首页/法务页的 HTML 微缓存区。
    #
    # 内存账：keys_zone=10m 是**共享内存区**，进程间共享、启动即分配；
    # max_size=64m 是磁盘上限。10m 共享内存对 2G 机器完全可接受，
    # 它换来的是"命中时不回源、不查库、不占 worker"。
    proxy_cache_path /var/cache/nginx/haiou_html
                     levels=1:2
                     keys_zone=haiou_html:10m
                     max_size=64m
                     inactive=10m
                     use_temp_path=off;   # 直接写入目标目录，避免跨文件系统拷贝（tmp→cache 的 rename 开销）

    # ---- gzip（brotli 见 conf.d）------------------------------------------
    # 应用侧 next.config.ts 已设 compress: false —— 压缩全部交给这里。
    # 原因写在那边：Nginx 多进程且缓存结果，比在 Node 单线程里压便宜得多。
    # ⚠️ 关掉本段会让响应完全不压缩，且必须同步把 compress 改回 true。
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;         #上游已压缩的响应不再二次压缩
    gzip_comp_level   5;           # 官方默认 1；5 是压缩率/CPU 的平衡点。
                                   # 2 核机器不要设9：收益递减而 CPU 线性上升
    gzip_min_length   1024;        # 小于 1KB 压缩不划算（头都占了）
    gzip_types        text/plain
                      text/css
                      text/xml
                      application/json
                      application/javascript
                      application/xml+rss
                      application/rss+xml
                      image/svg+xml
                      font/ttf
                      application/wasm;

    # include 顺序：00- 先做全局信任链调整，10- 再放站点与业务 location。
    include /etc/nginx/conf.d/*.conf;
}